<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        function detectLanguage() {
            const lang = navigator.language || navigator.userLanguage || 'en';
            const shortLang = lang.slice(0, 2).toLowerCase();
            
            if (shortLang === 'fr') {
                window.location.replace('fr/index.html');
            } else {
                window.location.replace('en/index.html');
            }
        }
        window.onload = detectLanguage;
    </script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 100px; background: #f4f4f4; color: #333; }
        p { font-size: 1.2rem; }
    </style>
</head>
<body>
    <p>Détection de la langue en cours...</p>
    <p>If you are not redirected, 
       <a href="fr/index.html">Français</a> or 
       <a href="en/index.html">English</a>.</p>
</body>
</html>
